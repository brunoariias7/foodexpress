<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - FoodExpress</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="navbar">
    <a href="index.html" class="logo"><span>Food</span>Express</a>
    <nav class="links">
        <a href="index.html">Inicio</a>
        <a href="menu.html">Menú</a>
        <a href="pedidos.html">Pedidos</a>
        <a href="nosotros.html">Nosotros</a>
        <a href="contacto.html">Contacto</a>
    </nav>
    <div class="nav-icons">
        <a href="pedidos.html" aria-label="Ver pedidos">🛒</a>
        <a href="login.html" aria-label="Iniciar sesión">♙</a>
    </div>
</header>
<main class="auth-pagina">
    <section class="auth-card">
        <h1>Crear una cuenta</h1>
        <p>Completá tus datos para registrarte.</p>
        <form>
        <label for="nombre">Nombre completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="nombre@correo.com" required>
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="Creá una contraseña" required>
        <label for="confirmar">Confirmar contraseña</label>
        <input type="password" id="confirmar" name="confirmar" placeholder="Repetí la contraseña" required>
            <button type="submit">Registrarme</button>
        </form>
        <p class="auth-enlace">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
    </section>
</main>
<footer>
    <div class="footer-logo"><span>Food</span>Express</div>
    <p>Tu comida favorita, donde quieras.</p>
    <p class="copyright">© 2026 FoodExpress - Todos los derechos reservados.</p>
</footer>
</body>
</html>
