<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú - FoodExpress</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="logo"><span>Food</span>Express</a>
        <nav class="links">
            <a href="index.html">Inicio</a>
            <a href="menu.html">Menú</a>
            <a href="pedidos.html">Pedidos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="contacto.html">Contacto</a>

        <div class="nav-icons">
            <a href="pedidos.html" aria-label="Ver pedidos">🛒</a>
            <a href="login.html" aria-label="Iniciar sesión">♙</a>
        </div>
    </header>

    <main>
        <section class="hero">
            <h1>Nuestro menú</h1>
            <p>Elegí tus favoritos y disfrutá de FoodExpress.</p>
        </section>

        <nav class="menu-categorias" aria-label="Categorías del menú">

            <a href="#empanadas">Empanadas</a>

        <section class="catalogo-seccion" id="hamburguesas">
            <h2>Hamburguesas</h2>
            <div class="grid" id="productos-hamburguesas">

        </section>

        <section class="catalogo-seccion" id="pizzas">
            <h2>Pizzas</h2>
            <div class="grid" id="productos-pizzas">
            </div>

        <section class="catalogo-seccion" id="empanadas">
            <h2>Empanadas</h2>
            <div class="grid" id="productos-empanadas">
            </div>
        </section>

        <section class="catalogo-seccion" id="sandwiches">
            <h2>Sándwiches</h2>
            <div class="grid" id="productos-sandwiches">
            </div>
        </section>

        <section class="catalogo-seccion" id="bebidas">
            <h2>Bebidas</h2>
            <div class="grid" id="productos-bebidas">
            </div>
